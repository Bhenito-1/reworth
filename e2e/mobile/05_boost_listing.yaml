# ReWorth Maestro — 05 Boost listing (stub)
# Seller owns a LIVE listing; mock PSP succeeds boost purchase.
# Demo seller (after seed:staging): Ori +2348010000001 / DemoOri!2026
appId: com.reworth.app
---
- launchApp
- assertVisible: "ReWorth"
- tapOn: "Sell"
# Open an owned live listing (from prior publish or My listings)
- tapOn:
    text: ".*"
    index: 0
    optional: true
- tapOn: "Boost listing"
- tapOn: "24h"
- assertVisible:
    text: "Price:|Getting price"
    optional: true
- tapOn: "Confirm & pay"
- assertVisible:
    text: "Boost active|Boosted|try again"
    optional: true
