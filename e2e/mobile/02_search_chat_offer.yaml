# ReWorth Maestro — 02 Search → chat → offer (stub)
# Demo buyer: Ayo ayo@demo.reworth.ng / DemoAyo!2026
appId: com.reworth.app
---
- launchApp
- assertVisible: "ReWorth"
- tapOn: "Search"
- inputText: "chair"
- tapOn:
    text: ".*chair.*"
    index: 0
- tapOn: "Save"
- tapOn: "Message seller"
- inputText: "Still available? Happy to meet in Ikoyi."
- tapOn: "Send"
- tapOn: "Make offer"
- inputText: "15000"
- tapOn: "Submit offer"
- assertVisible: "Offer sent"
