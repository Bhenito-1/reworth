# ReWorth Maestro — 03 Buy / checkout / review (stub)
# Buyer Ayo; assumes LIVE listing + mock PSP
appId: com.reworth.app
---
- launchApp
- tapOn: "Search"
- inputText: "E2E"
- tapOn:
    text: ".*"
    index: 0
- tapOn: "Buy now"
- tapOn: "Pickup"
- tapOn: "Pay with ReWorth"
# Mock PSP success in staging
- assertVisible: "Payment successful"
- tapOn: "Confirm receipt"
- tapOn: "Leave review"
- inputText: "Great meetup"
- tapOn: "Submit review"
- assertVisible: "Thanks"
