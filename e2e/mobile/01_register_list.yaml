# ReWorth Maestro — 01 Register / List (stub for device/sim UAT)
# Requires Expo app + Metro; not run in default CI.
# Demo seller (after seed:staging): ori@demo.reworth.ng / DemoOri!2026
appId: ng.reworth.mobile
---
- launchApp
- assertVisible: "ReWorth"
# Register or login path (email/password)
- tapOn: "Log in"
- tapOn:
    id: "email-input"
- inputText: "ori@demo.reworth.ng"
- tapOn:
    id: "password-input"
- inputText: "DemoOri!2026"
- tapOn: "Log in"
# Sell flow
- tapOn: "Sell"
- tapOn: "Add photos"
# … attach fixture image …
- tapOn: "Continue"
- assertVisible: "Title"
- inputText: "Maestro test chair"
- tapOn: "AI assist"
- tapOn: "Publish"
- assertVisible:
    text: "Live|Under review"
    optional: true
