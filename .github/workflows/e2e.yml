name: Full-stack e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e
        env:
          CI: "true"
          E2E_REQUIRED: "1"
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:3001/api/v1' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'http://localhost:3000' }}
