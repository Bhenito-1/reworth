name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contrast audit (design tokens)
        run: node scripts/contrast-audit.mjs

      - name: Hex audit (design-system paths)
        run: node scripts/hex-audit.mjs

      - name: Dependency audit (prod)
        run: pnpm audit:prod

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter=@reworth/web

      - name: Test
        run: pnpm exec turbo run test --filter=@reworth/web

      - name: Build
        run: pnpm exec turbo run build --filter=@reworth/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@reworth/web

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter=@reworth/admin

      - name: Test
        run: pnpm exec turbo run test --filter=@reworth/admin

      - name: Build
        run: pnpm exec turbo run build --filter=@reworth/admin

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@reworth/admin

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reworth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter=@reworth/api

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@reworth/api

      - name: Test
        run: pnpm exec turbo run test --filter=@reworth/api

      - name: Build
        run: pnpm exec turbo run build --filter=@reworth/api
