name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @reworth/api prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reworth

      - name: Contrast audit (design tokens)
        run: node scripts/contrast-audit.mjs

      - name: Hex audit (design-system paths)
        run: node scripts/hex-audit.mjs

      - name: Dependency audit (prod)
        working-directory: apps/api
        run: pnpm audit --prod --audit-level=critical

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reworth

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reworth

      - name: Build api, web, admin
        run: pnpm turbo run build --filter=@reworth/api --filter=@reworth/web --filter=@reworth/admin
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reworth

      # Golden-path Playwright. Specs skip when /healthz ≠ 200 (default CI green).
      # Set repo variable E2E=1 and start API + seed:staging to enforce real runs.
      - name: Playwright e2e (skip if API down)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
        env:
          API_BASE_URL: http://localhost:3001/api/v1
          WEB_BASE_URL: http://localhost:3000
