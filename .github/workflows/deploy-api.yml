name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - staging
          - production

jobs:
  deploy:
    name: Build API
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm exec turbo run build --filter=@reworth/api

      - name: API image is not wired yet
        run: |
          echo "API package built for ${{ inputs.environment }}."
          echo "Container deploy still needs apps/api/Dockerfile."
          echo "Apply migrations separately: pnpm --filter @reworth/api prisma:deploy"
          exit 1
