services:
  postgres:
    image: postgres:16
    container_name: reworth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reworth
      POSTGRES_PASSWORD: reworth
      POSTGRES_DB: reworth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reworth -d reworth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: reworth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 API for listing images (adobe/s3mock).
  # S3StorageAdapter / STORAGE_DRIVER=s3 talks to this endpoint.
  s3mock:
    image: adobe/s3mock:3.12.0
    container_name: reworth-s3mock
    restart: unless-stopped
    environment:
      # Pre-create bucket so first upload works before API bootstrap
      COM_ADOBE_TESTING_S3MOCK_DOMAIN_INITIAL_BUCKETS: reworth-media
      # Keep objects in /s3mockroot when the process exits (Docker Desktop stop/start).
      COM_ADOBE_TESTING_S3MOCK_DOMAIN_RETAIN_FILES_ON_EXIT: "true"
      # Path-style URLs: /{bucket}/{key}
      COM_ADOBE_TESTING_S3MOCK_HTTP_ENDPOINT: ""
    ports:
      # Host 9000 → container 9090 (s3mock default HTTP port)
      - "9000:9090"
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:9090/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: reworth-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reworth-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  s3mock_data:
