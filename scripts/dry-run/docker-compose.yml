# Throwaway infra for scripts/dry-run/run.sh only.
# Own project name and ports, so it never touches the normal reworth-postgres /
# reworth-redis containers or their volumes. Data lives in tmpfs and is gone
# when the containers stop.
name: reworth-dryrun
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reworth
      POSTGRES_PASSWORD: reworth
      POSTGRES_DB: reworth_dryrun
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reworth -d reworth_dryrun"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
